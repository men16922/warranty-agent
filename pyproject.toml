[project]
name = "warranty"
version = "0.1.0"
description = "Operational warranty for a GCP remediation agent — verify the action improved the signal, roll back atomically, and record what it cost"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# ⚠️ 클라우드 의존성은 게이트에 들어가지 않는다 (REQ-701).
# 게이트는 이것들 없이 통과해야 한다 — 있으면 fake 어댑터가 무의미해진다.
cloud = [
    # ⛔ **대회 필수 프레임워크다** (REQ-601 · design 06§1). 여기 없으면 `pip install ".[cloud]"`
    #    한 줄로 의존성을 얻는 배포 이미지에 **안 실린다** — 그 사실은 빌드에서도 게이트에서도
    #    안 보이고, 실물 호출을 처음 하는 날에 보인다. 버전 바닥은 실제로 설치해 introspect한
    #    2.7.1에서 온다 (design 06§2 · docs/evidence/adk-api-probe-2026-08-19.log).
    "google-adk>=2.7",
    # ⛔ **트래픽 전환·되읽기의 실물 절반이다**(REQ-301·302 · adapters/live_run.py).
    #    이 저장소가 GCP 전용인 이유가 여기 있다 — 배분을 한 번에 바꾸고 **다시 읽어** 증명한다.
    "google-cloud-run>=0.10",
    # Cloud Run 지연을 같은 필터·aligner·reducer로 다시 읽는다(REQ-201·202).
    "google-cloud-monitoring>=2.0",
    # 계약·원장의 실물 저장소(REQ-102·501 · adapters/live_store.py).
    "google-cloud-firestore>=2.16",
    # ⚠️ **전이 의존이 아니라 직접 임포트다.** `create()`가 이미 있는 문서에 대해 내는
    #    `AlreadyExists`를 이름으로 잡는다 — 1회=1행을 Firestore가 집행하게 하는 자리다
    #    (REQ-501). 선언 없이 쓰면 firestore가 그것을 안 끌고 오는 날 조용히 깨진다.
    "google-api-core>=2.19",
    "google-cloud-bigquery>=3.20",
    "google-genai>=1.0",
    "google-cloud-secret-manager>=2.16",
    "firebase-admin>=6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warranty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# ⛔ `-m 'not live'`가 그 **집행**이다. 없으면 아래 마커 설명은 문장일 뿐이고, 라이브 테스트를
#    하나 만드는 순간 `make check`가 그것을 돌리고 **과금한다** (T12-10 · REQ-801).
#    ⚠️ `make live-check`는 명령줄로 `-m live`를 줘서 이것을 덮는다 — 그 덮임이 실제로
#    일어나는지는 tests/test_gate_excludes_live.py가 **돌려서** 확인한다(문자열 대조 아님).
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: 실물 클라우드가 필요한 테스트. ⚠️ 게이트에 포함되지 않는다 (REQ-701)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
# ⚠️ `tests`가 여기 없으면 테스트의 `type: ignore`는 **아무도 안 읽는 주석**이다 —
#    strict의 `warn_unused_ignores`가 안 돌아서 필요 없어진 억제가 조용히 쌓인다(T0-9).
#    들어온 이상 남은 억제는 전부 **지금도 필요한 것**이고, 필요 없어지면 게이트가 red다.
files = ["src", "tools", "tests"]
