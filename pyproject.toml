[project]
name = "fleet-ledger"
version = "0.1.0"
description = "An agent fleet's ledger — attributing cloud spend to the actions that caused it"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# ⚠️ 클라우드 의존성은 게이트에 들어가지 않는다 (REQ-701).
# 게이트는 이것들 없이 통과해야 한다 — 있으면 fake 어댑터가 무의미해진다.
cloud = [
    "google-cloud-firestore>=2.16",
    "google-cloud-bigquery>=3.20",
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "live: 실물 클라우드가 필요한 테스트. ⚠️ 게이트에 포함되지 않는다 (REQ-701)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tools"]
